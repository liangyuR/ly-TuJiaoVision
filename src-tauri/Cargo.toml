[package]
name = "tujiao-vision"
version = "0.1.0"
description = "涂胶检测上位机"
edition = "2021"

[lib]
name = "tujiao_vision_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
libloading = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# lyFlow feat/glue（ABI v12，图像域 + 涂胶飞拍积木）。合入 main 并推送后改成 git 依赖、固定提交号。
lyflow-client = { path = "../../LyFlow-glue/crates/lyflow-client" }
ly-plc = { git = "ssh://git@github.com/liangyuR/ly-plc.git", branch = "main" }

# 模拟相机逐像素合成图像，未优化时一帧要一两秒，赶不上节拍
[profile.dev.package.tujiao-vision]
opt-level = 2
